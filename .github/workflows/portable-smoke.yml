name: Portable smoke

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-source-flow:
    name: ${{ matrix.os }} portable source flow
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .
      - name: Run the portable source quickstart
        run: python scripts/quickstart.py --mode source --output-dir build/portable
      - name: Run source contract tests
        run: python -W error -m unittest tests.test_generator -v
      - name: Run the complete native lakehouse quickstart
        if: runner.os != 'Windows'
        run: >-
          python scripts/quickstart.py
          --mode pipeline
          --output-dir build/portable-full
