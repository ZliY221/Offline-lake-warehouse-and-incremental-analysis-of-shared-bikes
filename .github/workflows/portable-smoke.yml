name: Portable smoke

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-source-flow:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} portable source flow
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Bootstrap the isolated runtime and run the portable source quickstart
        run: >-
          python scripts/bootstrap.py
          --
          --mode source
          --output-dir build/portable
      - name: Reuse the isolated runtime
        run: >-
          python scripts/bootstrap.py
          --
          --mode source
          --output-dir build/portable
      - name: Run the complete native lakehouse quickstart
        if: runner.os != 'Windows'
        run: >-
          python scripts/bootstrap.py
          --
          --mode pipeline
          --output-dir build/portable-full
