[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bike-trip-lakehouse"
version = "4.8.0"
description = "A reproducible PySpark batch lakehouse project"
requires-python = ">=3.10"
dependencies = [
    "pyspark==4.2.0",
]

[project.scripts]
inspect-compaction-journal = "bike_lakehouse.compaction_status_cli:main"
build-quality-actions = "bike_lakehouse.quality_actions_cli:main"
build-lakehouse-operations = "bike_lakehouse.operations_center_cli:main"
build-lakehouse-history = "bike_lakehouse.operations_history_cli:main"
plan-trip-backfill = "bike_lakehouse.backfill_plan_cli:main"
rehearse-operator-journeys = "bike_lakehouse.operator_journey_cli:main"
build-operator-workspace = "bike_lakehouse.operator_workspace_cli:main"
assess-partition-readiness = "bike_lakehouse.partition_readiness_cli:main"
plan-incremental-load-windows = "bike_lakehouse.incremental_window_cli:main"

[tool.ruff]
line-length = 100
