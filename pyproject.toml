[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bike-trip-lakehouse"
version = "0.13.4"
description = "A reproducible PySpark batch lakehouse project"
requires-python = ">=3.10"
dependencies = [
    "pyspark==4.2.0",
]

[project.scripts]
inspect-compaction-journal = "bike_lakehouse.compaction_status_cli:main"

[tool.ruff]
line-length = 100
